services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      CONTENT_DIR: /app/content
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./content:/app/content:ro
      - ./backend/migrations:/app/migrations
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 학생 코드를 실행할 이미지(bridge-sandbox)를 빌드만 하고 바로 끝난다.
  sandbox:
    build: ./sandbox
    image: bridge-sandbox
    entrypoint: ["true"]

  # Redis 큐에서 코드 실행 작업을 꺼내 bridge-sandbox 컨테이너로 실행한다.
  worker:
    build: ./backend
    env_file: .env
    environment:
      SANDBOX_IMAGE: bridge-sandbox
    volumes:
      - ./backend/app:/app/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: python -m app.worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      sandbox:
        condition: service_completed_successfully

volumes:
  pgdata:
